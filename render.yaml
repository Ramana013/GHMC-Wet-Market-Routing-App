services:
  - type: web
    name: ghmc-wet-market-frontend
    runtime: static          # Key fix: change env: static to runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ghmc-wet-marker-routing-app.onrender.com